<!DOCTYPE html>
<html lang="fr">
<head>

<body data-page="a-propos">

  <!-- En-tête commun à toutes les pages -->
  <header class="entete">

      <button id="menu-bouton" aria-expanded="false" aria-controls="menu">Menu</button>
      <nav id="menu" aria-label="Navigation principale">

        <a href="a-propos.html" class="actif" aria-current="page">À propos</a>
        <a href="realisations.html">Réalisations</a>

    <p id="contact-rapide"></p>

  <!-- Pied de page (rempli par script.js) -->

  <!-- data.js contient le contenu, script.js l'affiche -->
  <script src="js/data.js"></script>
